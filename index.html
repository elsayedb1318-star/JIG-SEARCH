<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.container{
    width:95%;
    max-width:900px;
    margin:30px auto;
    background:#fff;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
    padding:25px;
}

h1{
    text-align:center;
    color:#1565C0;
    margin-bottom:20px;
}

.search-box{
    display:flex;
    gap:10px;
}

#search{
    flex:1;
    padding:14px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    padding:14px 30px;
    background:#1565C0;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#0D47A1;
}

#status{
    margin-top:20px;
    font-weight:bold;
    color:#444;
}

#results{
    margin-top:20px;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    border-bottom:1px solid #ddd;
}

.item:hover{
    background:#f8f8f8;
}

.item span{
    font-size:17px;
}

.open{
    background:#43A047;
    color:white;
    text-decoration:none;
    padding:8px 14px;
    border-radius:6px;
}

.open:hover{
    background:#2E7D32;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#888;
}

@media(max-width:600px){

.search-box{
    flex-direction:column;
}

button{
    width:100%;
}

.item{
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
}

.open{
    width:100%;
    text-align:center;
}

}

</style>

</head>

<body>

<div class="container">

<h1>JIG SEARCH</h1>

<div class="search-box">

<input
type="text"
id="search"
placeholder="connector or order number">

<button onclick="searchPDF()">
بحث
</button>

</div>

<div id="status"></div>

<div id="results"></div>

<div class="footer">
Prepared by Elsayed adel
</div>

</div>

<script>

const API = https://script.google.com/macros/s/AKfycbxaq3QcGlyUCKD0IfaAqGGfRrOj2stn5en0zErRXN825_cbU48Tm6j7anTm0UAwxkfReA/exec

let timer=null;

function searchPDF(){

let q=document.getElementById("search").value.trim();

document.getElementById("results").innerHTML="";
document.getElementById("status").innerHTML="جاري البحث ...";

fetch(API+"?q="+encodeURIComponent(q))

.then(r=>r.json())

.then(data=>{

document.getElementById("status").innerHTML=
"عدد النتائج : "+data.length;

let html="";

if(data.length===0){

html="<h3>لا توجد نتائج</h3>";

}else{

data.forEach(file=>{

html+=`
<div class="item">

<span>📄 ${file.name}</span>

<a
class="open"
target="_blank"
href="${file.url}">
فتح الملف
</a>

</div>
`;

});

}

document.getElementById("results").innerHTML=html;

})

.catch(err=>{

document.getElementById("status").innerHTML="حدث خطأ أثناء البحث";

});

}

document.getElementById("search")
.addEventListener("keyup",function(){

clearTimeout(timer);

timer=setTimeout(searchPDF,500);

});

document.getElementById("search")
.addEventListener("keypress",function(e){

if(e.key==="Enter"){

searchPDF();

}

});

</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
