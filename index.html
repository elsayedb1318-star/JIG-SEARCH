<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JIG SEARCH</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#2196F3;
    color:#fff;
    text-align:center;
    padding:18px;
    font-size:28px;
    font-weight:bold;
}

.container{
    max-width:650px;
    margin:30px auto;
    padding:15px;
}

input{
    width:100%;
    padding:15px;
    font-size:18px;
    border:none;
    border-bottom:2px solid #2196F3;
    outline:none;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:15px;
    background:#2196F3;
    color:white;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1976D2;
}

.card{
    background:white;
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.card a{
    text-decoration:none;
    color:#000;
    font-size:17px;
    display:block;
}

#results{
    margin-top:20px;
}
</style>

</head>

<body>

<header>
JIG SEARCH
</header>

<div class="container">

<input
type="text"
id="txt"
placeholder="أدخل رقم Connector"
onkeypress="if(event.key==='Enter')search();">

<button onclick="search()">
بحث
</button>

<div id="results"></div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbwF8Iz9tcJRYl-YbkrSEAWhMgMqJVdRSY_EqSZhj-ozfjARQcb_by_moGAZuo0XkVK2/exec";

async function search(){

    const q=document.getElementById("txt").value.trim();

    if(q===""){
        alert("أدخل رقم Connector");
        return;
    }

    document.getElementById("results").innerHTML="<p>جارى البحث...</p>";

    try{

        const response=await fetch(API+"?q="+encodeURIComponent(q));

        const data=await response.json();

        let html="";

        if(data.length===0){

            html="<div class='card'>لا توجد نتائج</div>";

        }else{

            data.forEach(file=>{

                html+=`
                <div class="card">
                    <a href="${file.url}" target="_blank">
                        📄 ${file.name}
                    </a>
                </div>
                `;

            });

        }

        document.getElementById("results").innerHTML=html;

    }catch(err){

        document.getElementById("results").innerHTML=
        "<div class='card'>حدث خطأ أثناء الاتصال بالخادم.</div>";

        console.log(err);

    }

}

</script>

</body>
</html>
